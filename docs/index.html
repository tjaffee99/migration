<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas of Arrivals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Who came to what is now the United States, and from where, every year from 1607 to 2024.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: one column. Title, the year with a one-line reading of it, the world flow map at full
   width, the 418-year timeline that doubles as the scrubber, the year's origins, then notes. */
:root {
  --bg: #ffffff;
  --ink: #121417;
  --ink-2: #4b515a;
  --muted: #858b94;
  --line: #e7e9ec;
  --land: #eceef1;
  --us: #c9cfd7;
  --chip: #f2f3f5;
  --focus: #2a78d6;
  --dot: rgba(255, 255, 255, 0.9);

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s9: #a9aaa4;

  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.1875rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114; --ink: #eceef1; --ink-2: #b6bcc4; --muted: #7f868f; --line: #23272d;
    --land: #1c2025; --us: #3a424c; --chip: #1a1d21; --focus: #6da7ec; --dot: rgba(255, 255, 255, 0.85);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s9: #6b6c67;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1114; --ink: #eceef1; --ink-2: #b6bcc4; --muted: #7f868f; --line: #23272d;
  --land: #1c2025; --us: #3a424c; --chip: #1a1d21; --focus: #6da7ec; --dot: rgba(255, 255, 255, 0.85);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s9: #6b6c67;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--step-0);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
  display: grid;
  gap: 20px;
}
h1, h2 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 2px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.slider-focus { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 4px; }

/* ---------- head ---------- */
.head { display: flex; gap: 6px 14px; align-items: baseline; flex-wrap: wrap; }
.head h1 { font-size: var(--step-0); letter-spacing: 0.01em; }
.head .sub { color: var(--muted); font-size: var(--step--1); }

.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 32px; align-items: end; }
.year {
  font-weight: 300; font-size: clamp(4rem, 11vw, 7.5rem); line-height: 0.85; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums; min-width: 3.4ch;
}
.lede-box { display: grid; gap: 8px; padding-bottom: 4px; min-width: 0; }
.lede { font-size: var(--step-1); line-height: 1.4; max-width: 60ch; font-weight: 400; }
.lede strong { font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; color: var(--muted); font-size: var(--step--1); max-width: 90ch; }
.basis { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink-2); }
.basis i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.basis.estimate i { background: transparent; border: 1.5px solid currentColor; }
.basis.interp i { background: linear-gradient(90deg, currentColor 50%, transparent 50%); border: 1px solid currentColor; }
.ctx b { color: var(--ink-2); font-weight: 600; }

/* ---------- map ---------- */
.map { margin: 0; display: grid; gap: 8px; }
.map-box { position: relative; width: 100%; }
.map-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.country { stroke: var(--bg); stroke-width: 0.5; }
.us-jur { fill: var(--us); stroke: var(--bg); stroke-width: 0.35; pointer-events: none; }
.arrow { fill: none; stroke-linecap: round; pointer-events: none; transition: stroke-opacity 120ms; }
.head-tri { pointer-events: none; transition: fill-opacity 120ms; }
.flow { fill: none; stroke: var(--dot); stroke-linecap: round; pointer-events: none; animation: flow var(--dur, 1s) linear infinite; }
@keyframes flow { to { stroke-dashoffset: var(--off, -20px); } }
.hit { fill: none; stroke: transparent; stroke-linecap: round; pointer-events: stroke; cursor: pointer; }
.port { fill: var(--ink); stroke: var(--bg); stroke-width: 1.5; pointer-events: none; }
.label { font-size: 11.5px; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.label .v { fill: var(--muted); font-variant-numeric: tabular-nums; }
.label .n { font-weight: 600; }
.map-key { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; font-size: 12px; color: var(--muted); }
.map-key svg { display: block; overflow: visible; }
.map-key .note { color: var(--ink-2); }
.wkey { display: inline-flex; gap: 10px; align-items: center; }
.wkey text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

/* ---------- timeline ---------- */
.timeline { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.tl-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.play {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
  display: inline-grid; place-items: center; cursor: pointer; flex: none;
}
.play:hover { border-color: var(--ink-2); }
.play svg { width: 14px; height: 14px; fill: var(--ink); }
.seg { display: inline-flex; gap: 2px; background: var(--chip); border-radius: 999px; padding: 3px; flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer;
  font-size: var(--step--1); color: var(--ink-2); min-height: 28px;
}
.seg-sm button { padding: 2px 10px; min-height: 24px; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); font-weight: 500; }
.strip { position: relative; width: 100%; touch-action: none; }
.strip svg { display: block; width: 100%; height: auto; overflow: visible; cursor: ew-resize; }
.axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.axis line { stroke: var(--line); }
.cursor { stroke: var(--ink); stroke-width: 1.5; }
.cursor-knob { fill: var(--ink); }
.hover-line { stroke: var(--ink-2); stroke-width: 1; stroke-opacity: 0.6; }
.event-tick { stroke: var(--muted); stroke-width: 1; }
.band text { fill: var(--muted); font-size: 10.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend b { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ---------- origins ---------- */
.origins { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.o-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
.o-head h2 { font-size: var(--step-0); }
.link { border: 0; background: none; padding: 0; color: var(--ink-2); cursor: pointer; font-size: var(--step--1); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.link:hover { color: var(--ink); text-decoration-color: currentColor; }
.o-search input {
  width: min(100%, 360px); border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
  padding: 6px 14px; min-height: 34px;
}
.olist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; }
.olist li { min-width: 0; }
.orow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: baseline; width: 100%;
  padding: 7px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer;
}
.orow:hover .nm, .orow[aria-pressed="true"] .nm { text-decoration: underline; text-underline-offset: 3px; }
.orow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.orow .vl { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.orow .vl small { color: var(--muted); margin-left: 8px; font-size: 12px; }
.orow .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--chip); overflow: hidden; }
.orow .bar i { display: block; height: 100%; border-radius: 0 2px 2px 0; }
.olist .empty { color: var(--muted); font-size: var(--step--1); grid-column: 1 / -1; }
.detail { display: grid; gap: 6px; padding: 12px 14px; background: var(--chip); border-radius: 10px; }
.detail .d-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
.detail h3 { margin: 0; font-size: var(--step-0); font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.detail h3 i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.detail p { font-size: var(--step--1); color: var(--ink-2); }
.detail svg { display: block; width: 100%; height: 64px; }

/* ---------- about ---------- */
.about { border-top: 1px solid var(--line); padding-top: 14px; }
.about summary { cursor: pointer; font-weight: 600; font-size: var(--step-0); }
.about-body { display: grid; gap: 14px; padding-top: 14px; }
.about-body h3 { margin: 0; font-size: var(--step-0); font-weight: 600; }
.about-body p, .about-body li { color: var(--ink-2); max-width: 76ch; font-size: 14px; }
.about-body ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.about-body details summary { font-weight: 600; }
.table-scroll { overflow-x: auto; }
.about-body table { border-collapse: collapse; font-size: 13px; min-width: 620px; }
.about-body th, .about-body td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
.about-body th { color: var(--muted); font-weight: 500; font-size: 12px; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }

/* ---------- tooltip ---------- */
.tip {
  position: fixed; z-index: 20; pointer-events: none; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14); max-width: 300px; display: grid; gap: 3px;
}
.tip h4 { margin: 0; font-size: 13px; font-weight: 600; }
.tip .row { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px; align-items: center; }
.tip .row i { width: 12px; height: 3px; border-radius: 2px; }
.tip .row b { font-variant-numeric: tabular-nums; font-weight: 600; }
.tip .row span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip .note { color: var(--muted); font-size: 11.5px; }

@media (max-width: 720px) {
  .wrap { gap: 16px; padding-block: 20px 32px; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .olist { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; display: none; }
  .arrow, .head-tri { transition: none; }
}

</style>
<main class="wrap">
  <header class="head">
    <h1>Atlas of Arrivals</h1>
    <p class="sub">Who came to what is now the United States, and from where, <span id="y-start">1607</span>–<span id="y-end">2024</span></p>
  </header>

  <section class="hero" aria-live="polite">
    <div class="year" id="year">1910</div>
    <div class="lede-box">
      <p class="lede" id="lede">Loading…</p>
      <p class="meta"><span class="basis" id="basis"></span><span class="ctx" id="context"></span></p>
    </div>
  </section>

  <figure class="map">
    <div class="map-box" id="map" role="img" aria-label="World map with arrows from each origin to the United States, scaled by the number of arrivals"></div>
    <figcaption class="map-key" id="map-key"></figcaption>
  </figure>

  <section class="timeline" aria-label="Timeline">
    <div class="tl-head">
      <button class="play" id="play" type="button" aria-pressed="false" aria-label="Play">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4.5 2.5v11l9-5.5z"/></svg>
      </button>
      <div class="seg" role="group" aria-label="Timeline shows" id="series">
        <button type="button" data-series="flow" aria-pressed="true">Arrivals each year</button>
        <button type="button" data-series="stock" aria-pressed="false">Immigrants living in the US</button>
      </div>
      <label class="sr-only" for="slider">Year</label>
      <input class="sr-only" id="slider" type="range" min="1607" max="2024" step="1" value="1910">
    </div>
    <div class="strip" id="strip"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="origins" aria-labelledby="o-title">
    <div class="o-head">
      <h2 id="o-title">Top origins in <span id="o-year">1910</span></h2>
      <button class="link" id="more" type="button">All origins</button>
    </div>
    <div class="o-search" id="o-search" hidden>
      <label class="sr-only" for="q">Find an origin</label>
      <input id="q" type="search" placeholder="Find a country or region" autocomplete="off">
    </div>
    <div class="detail" id="detail" hidden></div>
    <ol class="olist" id="olist"></ol>
  </section>

  <details class="about" id="about">
    <summary>About the data</summary>
    <div class="about-body" id="about-body"></div>
  </details>

  <footer class="foot">
    <span>Built from census, immigration and slave-trade records.</span>
    <a href="https://github.com/tjaffee99/migration" target="_blank" rel="noopener">Code and data on GitHub</a>
  </footer>
</main>

kers settle near Philadelphia, opening Pennsylvania to German-speaking migration."},{"y":1717,"title":"Ulster migration begins","t":"Large-scale emigration of Presbyterian Scots-Irish from Ulster to Pennsylvania and the backcountry starts around 1717–1718."},{"y":1718,"title":"New Orleans founded","t":"French Louisiana's capital becomes the main entry point for enslaved Africans to the Gulf Coast."},{"y":1754,"title":"Seven Years' War","t":"War in North America and Europe sharply reduces transatlantic migration until 1763."},{"y":1775,"title":"American Revolution","t":"War halts most immigration and the slave trade until the 1780s."},{"y":1790,"title":"Naturalization Act","t":"Congress limits naturalization to \"free white persons\" of good character."},{"y":1803,"title":"Louisiana Purchase","t":"The US buys French Louisiana. South Carolina had reopened its slave trade in 1803, and imports surge until 1807."},{"y":1808,"title":"Slave importation banned","t":"The federal ban on importing enslaved people takes effect on January 1, 1808. Smuggling continues on a small scale."},{"y":1819,"title":"Steerage Act","t":"The first federal law regulating passenger ships requires arrival manifests, the basis of US immigration statistics from 1820."},{"y":1845,"title":"Irish Famine","t":"Potato blight causes famine in Ireland (1845–1852); over a million Irish emigrate to the US over the following decade."},{"y":1848,"title":"Revolutions in Europe; Mexican Cession","t":"Failed revolutions push German emigration. The Treaty of Guadalupe Hidalgo transfers northern Mexico to the US."},{"y":1849,"title":"California Gold Rush","t":"Migrants arrive from China, Mexico, Chile, Europe and Australia."},{"y":1862,"title":"Homestead Act","t":"Free land in the West attracts Scandinavian, German and Czech farmers."},{"y":1875,"title":"Page Act","t":"The first restrictive federal immigration law, aimed mainly at Chinese women."},{"y":1882,"title":"Chinese Exclusion Act","t":"Chinese laborers are barred from entering; the ban is extended until 1943."},{"y":1892,"title":"Ellis Island opens","t":"The federal immigration station in New York Harbor processes most arrivals for the next three decades."},{"y":1907,"title":"Peak year of the great wave","t":"About 1.3 million immigrants are admitted, mostly from Southern and Eastern Europe. The Gentlemen's Agreement (1907–1908) limits Japanese labor migration."},{"y":1914,"title":"World War I","t":"War in Europe cuts transatlantic migration sharply."},{"y":1917,"title":"Immigration Act of 1917","t":"Adds a literacy test and an \"Asiatic Barred Zone\"."},{"y":1921,"title":"Emergency Quota Act","t":"First numerical quotas by national origin, set at 3% of each group's 1910 population."},{"y":1924,"title":"Johnson–Reed Act","t":"National-origins quotas cut immigration from Southern and Eastern Europe and bar most Asians. The Western Hemisphere stays outside the quotas."},{"y":1929,"title":"Great Depression","t":"Immigration falls to its lowest level since the 1830s; hundreds of thousands of Mexicans and Mexican Americans are pushed to leave."},{"y":1942,"title":"Bracero Program","t":"A US–Mexico agreement brings Mexican contract workers (1942–1964); braceros were temporary workers, not counted as immigrants."},{"y":1943,"title":"Chinese exclusion repealed","t":"The Magnuson Act ends exclusion but sets a quota of 105 Chinese immigrants a year."},{"y":1948,"title":"Displaced Persons Act","t":"Admits about 400,000 Europeans displaced by World War II by 1952."},{"y":1952,"title":"McCarran–Walter Act","t":"Keeps national-origins quotas but ends the racial bar on naturalization."},{"y":1959,"title":"Cuban Revolution","t":"The first of several waves of Cuban exiles arrives in Florida."},{"y":1965,"title":"Hart–Celler Act","t":"Abolishes national-origins quotas in favor of family and skills preferences. Asian and Latin American immigration grows sharply."},{"y":1975,"title":"Fall of Saigon","t":"Refugee resettlement from Vietnam, Laos and Cambodia begins."},{"y":1980,"title":"Refugee Act; Mariel boatlift","t":"Congress creates the modern refugee system. About 125,000 Cubans arrive by boat from Mariel."},{"y":1986,"title":"IRCA amnesty","t":"About 2.7 million unauthorized residents gain legal status. Most of them are counted as new permanent residents in 1989–1991, which produces the spike in those years."},{"y":1990,"title":"Immigration Act of 1990","t":"Raises overall limits and creates the diversity visa lottery."},{"y":2001,"title":"September 11 attacks","t":"Security reforms follow and the Department of Homeland Security takes over immigration services (2003)."},{"y":2020,"title":"COVID-19 pandemic","t":"Consular closures and travel restrictions sharply cut new permanent residents in 2020 and 2021."}],"sources":[{"id":"hsus1975_Z1_19","cite":"U.S. Bureau of the Census, Historical Statistics of the United States, Colonial Times to 1970 (Bicentennial ed., 1975), Part 2, Ch. Z, Series Z 1-19 'Estimated Population of American Colonies: 1610 to 1780' (compiled by Stella H. Sutherland), p. 1168","url":"https://www2.census.gov/library/publications/1975/compendia/hist_stats_colonial-1970/hist_stats_colonial-1970p2-chZ.pdf"},{"id":"wikipedia_list_colonial_population","cite":"Wikipedia, 'List of colonial and pre-Federal U.S. historical population' (wikitext), reproducing HSUS Z 1-19 totals","url":"https://en.wikipedia.org/w/index.php?title=List_of_colonial_and_pre-Federal_U.S._historical_population&action=raw"},{"id":"census_twps0056_appA","cite":"Campbell Gibson and Kay Jung, 'Historical Census Statistics on Population Totals by Race, 1790 to 1990, and by Hispanic Origin, 1970 to 1990, for the United States, Regions, Divisions, and States', U.S. Census Bureau Population Division Working Paper No. 56 (2002), Appendix A tables A-21 to A-26 (1840-1790)","url":"https://www2.census.gov/library/working-papers/2002/demo/pop-twps0056/appendixA.xlsx"},{"id":"slavevoyages_tast_estimates","cite":"SlaveVoyages, Trans-Atlantic Slave Trade - Estimates (assessment database), disembarked captives by year, embarkation region and disembarkation region; queried via the site's public API endpoint /api/assessment/crosstabs/","url":"https://www.slavevoyages.org/voyage/trans-atlantic (Estimates); API https://www.slavevoyages.org/api/assessment/crosstabs/"},{"id":"slavevoyages_iastd","cite":"SlaveVoyages, Intra-American Slave Trade Database (voyage-level, dataset=1), imputed captives disembarked by year of arrival, region of purchase and principal region of disembarkation; via /api/voyage/crosstabs/","url":"https://www.slavevoyages.org/voyage/intra-american ; API https://www.slavevoyages.org/api/voyage/crosstabs/"},{"id":"fogleman1992_jih_via_tomlins2001","cite":"Aaron S. Fogleman, 'Migrations to the Thirteen British North American Colonies, 1700-1775: New Estimates', Journal of Interdisciplinary History 22:4 (1992), 691-709; decade x group table as reproduced in Christopher Tomlins, 'Reconsidering Indentured Servitude: European Migration and the Early American Labor Force, 1600-1775', Labor History 42:1 (2001), Appendix III Table A1","url":"https://library.fes.de/libalt/journals/swetsfulltext/11116561.pdf"},{"id":"tomlins2001_laborhistory","cite":"Christopher Tomlins, 'Reconsidering Indentured Servitude: European Migration and the Early American Labor Force, 1600-1775', Labor History 42:1 (2001), 5-43, text and Appendix I/III","url":"https://library.fes.de/libalt/journals/swetsfulltext/11116561.pdf"},{"id":"tomlins2001_table1_menard","cite":"Tomlins (2001) Table 1 'European migration, servant migration and population estimates, Maryland and Virginia, 1600-1700', derived from Russell R. Menard, 'British Migration to the Chesapeake Colonies in the Seventeenth Century', in Carr et al., Colonial Chesapeake Society (1988), Tables 2-3, and McCusker & Menard, The Economy of British America (1985), Table 6.4","url":"https://library.fes.de/libalt/journals/swetsfulltext/11116561.pdf"}, Y2024.B05006&g=010XX00US$0400000"},{"id":"ahcb","cite":"Newberry Library, Atlas of Historical County Boundaries (state and territory boundaries, CC0).","url":"https://publications.newberry.org/ahcb/"},{"id":"natural_earth","cite":"Natural Earth country boundaries via world-atlas and us-atlas (public domain / ISC).","url":"https://www.naturalearthdata.com/"}],"about":{"intro":["This atlas follows migration into the territory of the present-day United States for every year from 1607 to 2024. Two measures run through it. Arrivals count the people who came in a given year, by where they came from. Immigrants living in the US count residents born abroad, by birthplace, as censuses and surveys recorded them.","No single record covers four centuries, so each era uses the best source available, and the page marks which kind of number you are looking at. Official counts show as plain figures. Estimates show with a ≈ sign and an outlined marker. Values between census years are interpolated."],"caveats":["Before 1820 nobody counted arrivals. Colonial figures are historians' reconstructions with wide ranges (for example, 84,500–120,000 Germans arriving 1700–1775). They are spread evenly over each period, so year-to-year changes before 1820 are not real.","Enslaved Africans were brought by force. They are counted from the SlaveVoyages estimates of captives landed directly from Africa, plus documented voyages from the Caribbean. Smuggling after the 1808 ban is undercounted, and the domestic slave trade is internal migration, so it is left out.","From 1820 to 1987 the yearly totals are official, but origins by country were published by decade. Each decade's country totals are spread across its years using yearly counts for broad country groups (through 1957) or in proportion to the yearly totals (1958–1987). Per-country values in those years are shown with a ≈ sign.","Official arrivals record country of last residence through 1988 and country of birth from 1989; the two can differ. From 1892 they count immigrants admitted; since the 1980s they count people granted permanent residence that year, including people already living in the US. The 1989–1991 spike is the 1986 amnesty (IRCA). Unauthorized migration, temporary workers and refugees not yet adjusted are not counted as arrivals.","Country names follow each source. Empires and unions that later split (Austria-Hungary, the Soviet Union, Yugoslavia, Czechoslovakia) appear under their historical names, so a country's line can start or stop when borders changed.","Census birthplace data begin in 1850 and are interpolated between census years. The 1940 and 1950 censuses tabulated country of birth for white residents only; other foreign-born residents appear as not tabulated.","Arrows start at each origin and end at a schematic point of arrival chosen from where the origin lies: the main East Coast port of the era, Florida, the Mexican border, San Francisco or the Canadian border. Arrows for enslaved Africans end at the landing region SlaveVoyages records. Arrow width grows with the square root of the number of people, on one scale for all years.","The shaded United States shows the colonies, states and territories as they stood on July 1 of the year. Colonies are drawn from their organized counties rather than their sea-to-sea charter claims."]},"eras":[{"years":"1607–1775","flow":"Historians' estimates by period (Menard; Tomlins; Fogleman) and SlaveVoyages estimates for enslaved Africans.","stock":"Not recorded."},{"years":"1776–1819","flow":"War years without an estimate, then about 9,900 Europeans a year (Grabbe via Cohn) with an assumed origin mix; slave trade from SlaveVoyages.","stock":"Not recorded."},{"years":"1820–1987","flow":"Official yearly totals; origins from official decade totals (DHS Yearbook Tables 1 and 2), timed within each decade by yearly counts for 22 country groups through 1957 (Historical Statistics of the US, 1960).","stock":"Census birthplace counts every ten years from 1850 (Census Working Papers 29 and 81)."},{"years":"1988–2023","flow":"Official yearly counts: by country of last residence in 1988, by country of birth from 1989 (INS and DHS yearbooks).","stock":"Census 1990 and 2000; American Community Survey each year from 2005."}]};

      .attr("d", (a) => a.d)
      .attr("stroke-width", (a) => Math.max(1.1, a.w * 0.34))
      .each(function (a) {
        const gap = clamp(a.w * 2.4, 10, 44);
        this.style.strokeDasharray = `0 ${gap}`;
        this.style.setProperty("--off", -gap + "px");
        this.style.setProperty("--dur", (gap / 26).toFixed(2) + "s");
      });
    // arrival points in use
    const ports = new Map();
    for (const a of arrows) ports.set(a.to.join(","), a.to);
    gPorts.selectAll("circle").data([...ports.values()], (p) => p.join(",")).join("circle").attr("class", "port")
      .attr("r", 2.6).attr("cx", (p) => proj(p)[0]).attr("cy", (p) => proj(p)[1]);
    // hover targets, widest on top
    gHit.selectAll("path").data(arrows, (a) => a.key).join("path").attr("class", "hit")
      .attr("d", (a) => a.d).attr("stroke-width", (a) => Math.max(12, a.w + 8))
      .on("pointerenter", (evt, a) => showArrowTip(evt, a, F, approx))
      .on("pointermove", moveTip)
      .on("pointerleave", hideTip)
      .on("click", (evt, a) => selectOrigin(S.origin === a.id ? null : a.id));
    drawLabels(arrows, F, approx);
    drawKey(y, arrows);
  }

  function drawLabels(arrows, F, approx) {
    // name the largest origins (one label per origin), skipping any that would collide
    const byOrigin = new Map();
    for (const a of arrows) {
      const o = originById[a.id];
      if (o.residual) continue;
      const cur = byOrigin.get(a.id);
      if (!cur || a.v > cur.v) byOrigin.set(a.id, { id: a.id, v: 0, p0: a.p0 });
    }
    for (const d of F.list) if (byOrigin.has(d.id)) byOrigin.get(d.id).v = d.v;
    // label the top three and anything above 1% of the year's arrivals
    let cands = [...byOrigin.values()].sort((a, b) => b.v - a.v).filter((c, k) => k < 3 || c.v >= 0.01 * (F.total || 0));
    if (S.origin) cands = cands.filter((c) => c.id === S.origin).concat(cands.filter((c) => c.id !== S.origin));
    const max = W < 640 ? 4 : 9;
    const placed = [];
    const out = [];
    for (const c of cands) {
      if (out.length >= max) break;
      const o = originById[c.id];
      const name = o.short || o.name;
      const val = fmtCount(c.v, approx);
      const wpx = Math.max(name.length * 6.6, val.length * 6) + 6;
      const x = c.p0[0], yTop = c.p0[1] - 30;
      const box = [x - wpx / 2, yTop, x + wpx / 2, c.p0[1] - 4];
      if (box[0] < 0 || box[2] > W || box[1] < 0) continue;
      if (placed.some((p) => !(box[2] < p[0] || box[0] > p[2] || box[3] < p[1] || box[1] > p[3]))) continue;
      placed.push(box);
      out.push({ id: c.id, x, y: c.p0[1], name, val });
    }
    const t = gLabels.selectAll("text").data(out, (d) => d.id).join((enter) => {
      const tx = enter.append("text").attr("class", "label").attr("text-anchor", "middle");
      tx.append("tspan").attr("class", "n");
      tx.append("tspan").attr("class", "v");
      return tx;
    });
    t.attr("x", (d) => d.x).attr("y", (d) => d.y - 18);
    t.select("tspan.n").attr("x", (d) => d.x).text((d) => d.name);
    t.select("tspan.v").attr("x", (d) => d.x).attr("dy", "1.15em").text((d) => d.val);
  }

  function drawKey(y, arrows) {
    const key = $("map-key");
    key.replaceChildren();
    const wk = el("span", "wkey");
    const top = wScale.domain()[1];
    const samples = [1e2, 1e3, 1e4, 1e5, 1e6].filter((v) => v <= top * 1.05 && v >= top / 2000).slice(-4);
    const ns = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(ns, "svg");
    const maxw = width(samples[samples.length - 1] || top);
    const yLine = maxw / 2 + 1, yText = maxw + 14;
    let x = 0;
    for (const v of samples) {
      const w = width(v);
      const ln = document.createElementNS(ns, "line");
      ln.setAttribute("x1", x + w / 2); ln.setAttribute("x2", x + 34 - w / 2);
      ln.setAttribute("y1", yLine); ln.setAttribute("y2", yLine);
      ln.setAttribute("stroke", css("--ink-2"));
      ln.setAttribute("stroke-width", w);
      ln.setAttribute("stroke-linecap", "round");
      const tx = document.createElementNS(ns, "text");
      tx.setAttribute("x", x + 17); tx.setAttribute("y", yText); tx.setAttribute("text-anchor", "middle");
      tx.textContent = compact(v);
      s.append(ln, tx);
      x += 52;
    }
    s.setAttribute("width", Math.max(1, x - 18));
    s.setAttribute("height", yText + 3);
    s.setAttribute("aria-hidden", "true");
    wk.append(el("span", null, "Arrow width: people arriving"), s);
    key.append(wk);
    const seg = el("span", "seg seg-sm");
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "Arrow width scale");
    for (const [k, label] of [["all", "Same scale every year"], ["year", "Fit to " + y]]) {
      const b = el("button", null, label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(S.scale === k));
      b.addEventListener("click", () => { S.scale = k; drawMap(); });
      seg.append(b);
    }
    key.append(seg);
    if (arrows.some((a) => a.forced)) key.append(el("span", "note", "Arrows from Africa this year carry enslaved people brought by force."));
    key.append(el("span", null, "Arrows end at a schematic point of arrival. Hover for numbers; click to follow one origin."));
  }

  function showArrowTip(evt, a, F, approx) {
    const o = originById[a.id];
    showTip(evt, (t) => {
      t.append(el("h4", null, o.name));
      tipRow(t, color[o.group], a.forced ? "Enslaved people landed" : "Arrived in " + S.year, fmtCount(a.v, approx || a.forced));
      if (F.total && !a.forced) t.append(el("div", "note", pct(a.v / F.total) + " of all arrivals"));
      t.append(el("div", "note", (a.forced ? "Landed: " : "Shown arriving at: ") + a.dest));
      if (o.note) t.append(el("div", "note", o.note));
    });
  }
  function showCountryTip(evt, f) {
    const iso = f.properties.iso3;
    showTip(evt, (t) => {
      t.append(el("h4", null, f.properties.name));
      if (iso === "USA") { t.append(el("div", "note", "Destination")); return; }
      const units = (unitsByIso.get(iso) || []).slice().sort((a, b) => b.v - a.v);
      if (!units.length) { t.append(el("div", "note", `No arrivals recorded from here in ${S.year}.`)); return; }
      const approx = basisInfo(D.flow.basis[S.year - Y0]).cls !== "official";
      for (const u of units) {
        const o = originById[u.id];
        tipRow(t, color[o.group], o.name, fmtCount(u.v, approx));
        if ((o.iso || []).length > 1) t.append(el("div", "note", `Reported as one unit spanning ${o.iso.length} present-day countries.`));
      }
    });
  }

  // ---------- timeline strip ----------
  const stripBox = $("strip");
  let strip = null;
  function layoutStrip() {
    const Wd = Math.max(320, stripBox.clientWidth || 1200);
    const Ht = Wd < 640 ? 96 : 120;
    const m = { t: 14, r: 2, b: 22, l: 2 };
    stripBox.replaceChildren();
    const s = d3.select(stripBox).append("svg").attr("viewBox", `0 0 ${Wd} ${Ht}`).attr("role", "img");
    const x = d3.scaleLinear().domain([Y0, Y1]).range([m.l, Wd - m.r]);
    strip = { s, Wd, Ht, m, x, gArea: s.append("g"), gAxis: s.append("g").attr("class", "axis"), gBand: s.append("g").attr("class", "band"), gEv: s.append("g") };
    strip.hover = s.append("line").attr("class", "hover-line").attr("y1", m.t).attr("y2", Ht - m.b).attr("visibility", "hidden");
    strip.cursor = s.append("line").attr("class", "cursor").attr("y1", m.t - 4).attr("y2", Ht - m.b);
    strip.knob = s.append("circle").attr("class", "cursor-knob").attr("r", 4).attr("cy", m.t - 4);
    const overlay = s.append("rect").attr("x", 0).attr("y", 0).attr("width", Wd).attr("height", Ht).attr("fill", "transparent");
    const yearAt = (evt) => clamp(Math.round(x.invert(d3.pointer(evt, s.node())[0])), Y0, Y1);
    let drag = false;
    overlay
      .on("pointerdown", (evt) => { drag = true; overlay.node().setPointerCapture(evt.pointerId); stopPlay(); setYear(yearAt(evt)); })
      .on("pointerup pointercancel", () => { drag = false; })
      .on("pointermove", (evt) => {
        const yy = yearAt(evt);
        if (drag) setYear(yy);
        strip.hover.attr("visibility", "visible").attr("x1", x(yy)).attr("x2", x(yy));
        showStripTip(evt, yy);
      })
      .on("pointerleave", () => { strip.hover.attr("visibility", "hidden"); hideTip(); });
    drawStrip();
  }
  function drawStrip() {
    if (!strip) return;
    const { s, Wd, Ht, m, x, gArea, gAxis, gBand, gEv } = strip;
    const data = S.series === "flow" ? flowGroups : stockGroups.filter((r) => r.year >= STOCK_FIRST);
    const series = d3.stack().keys(groups.map((g) => g.id)).offset(d3.stackOffsetExpand)(data);
    const y = d3.scaleLinear().domain([0, 1]).range([Ht - m.b, m.t]);
    const area = d3.area().curve(d3.curveMonotoneX).x((d) => x(d.data.year))
      .y0((d) => (isNaN(d[0]) ? y(0) : y(d[0]))).y1((d) => (isNaN(d[1]) ? y(0) : y(d[1])));
    gArea.selectAll("path").data(series, (d) => d.key).join("path").attr("d", area)
      .attr("fill", (d) => color[d.key]).attr("fill-opacity", 0.9);
    gAxis.selectAll("*").remove();
    const ticks = Wd < 640 ? [1607, 1700, 1800, 1900, 2024] : [1607, 1650, 1700, 1750, 1800, 1850, 1900, 1950, 2000, 2024];
    gAxis.selectAll("text").data(ticks).join("text").attr("x", (d) => x(d)).attr("y", Ht - 6)
      .attr("text-anchor", (d) => (d === Y0 ? "start" : d === Y1 ? "end" : "middle")).text((d) => d);
    if (S.series === "stock") {
      gAxis.append("text").attr("x", x((Y0 + STOCK_FIRST) / 2)).attr("y", (m.t + Ht - m.b) / 2 + 4).attr("text-anchor", "middle")
        .text(`Birthplace first recorded in the ${STOCK_FIRST} census`);
    }
    // where the record turns from estimates to official counts
    gBand.selectAll("*").remove();
    const firstOfficial = S.series === "flow" ? Y0 + D.flow.basis.search(/[HDAB]/) : SY[D.stock.kind.indexOf("acs")];
    const startX = S.series === "flow" ? x(Y0) : x(STOCK_FIRST);
    gBand.append("line").attr("x1", startX).attr("x2", x(firstOfficial)).attr("y1", 5).attr("y2", 5).attr("stroke", css("--muted")).attr("stroke-dasharray", "1 3");
    gBand.append("line").attr("x1", x(firstOfficial)).attr("x2", x(Y1)).attr("y1", 5).attr("y2", 5).attr("stroke", css("--muted"));
    if (Wd > 560) {
      gBand.append("text").attr("x", startX).attr("y", 2).text(S.series === "flow" ? "Estimates" : "Census every ten years");
      gBand.append("text").attr("x", x(firstOfficial) + 4).attr("y", 2).text(S.series === "flow" ? "Official counts" : "Yearly survey");
    }
    gEv.selectAll("*").remove();
    for (const e of D.events) {
      gEv.append("line").attr("class", "event-tick").attr("x1", x(e.y)).attr("x2", x(e.y)).attr("y1", Ht - m.b).attr("y2", Ht - m.b + 4);
    }
    s.attr("aria-label", (S.series === "flow" ? "Share of arrivals" : "Share of immigrants living in the US") + " by region of origin, " + Y0 + " to " + Y1);
    const leg = $("legend");
    leg.replaceChildren();
    for (const g of groups) {
      const sp = el("span");
      const b = el("b");
      b.style.background = color[g.id];
      sp.append(b, document.createTextNode(g.name));
      leg.append(sp);
    }
    moveCursor();
  }
  function moveCursor() {
    if (!strip) return;
    const cx = strip.x(S.year);
    strip.cursor.attr("x1", cx).attr("x2", cx);
    strip.knob.attr("cx", cx);
  }
  function showStripTip(evt, yy) {
    const row = S.series === "flow" ? flowGroups[yy - Y0] : stockGroups[yy - Y0];
    const ev = D.events.filter((e) => e.y === yy);
    showTip(evt, (t) => {
      t.append(el("h4", null, String(yy)));
      for (const e of ev) t.append(el("div", "note", e.title));
      const tot = d3.sum(groups, (g) => row[g.id]);
      if (!tot) { t.append(el("div", "note", S.series === "flow" ? "No arrivals recorded." : "Not recorded before " + STOCK_FIRST + ".")); return; }
      for (const g of [...groups].reverse()) if (row[g.id] > 0) tipRow(t, color[g.id], g.name, pct(row[g.id] / tot));
      t.append(el("div", "note", (S.series === "flow" ? "Arrivals: " : "Born abroad: ") + fmtInt(Math.round(tot))));
    });
  }

  // ---------- origins list ----------
  function drawList() {
    const y = S.year;
    const F = flowsAt(y);
    const approx = basisInfo(F.basis).cls !== "official";
    $("o-year").textContent = y;
    const list = $("olist");
    list.replaceChildren();
    const q = S.query.trim().toLowerCase();
    let rows = F.list;
    if (q) {
      const present = new Map(F.list.map((d) => [d.id, d.v]));
      rows = origins.filter((o) => o.name.toLowerCase().includes(q)).map((o) => ({ id: o.id, v: present.get(o.id) || 0 })).sort((a, b) => b.v - a.v);
    }
    const shown = q || S.showAll ? rows : rows.slice(0, 10);
    if (!shown.length) list.append(el("li", "empty", q ? "No origin matches that search." : "No arrivals recorded this year."));
    const max = F.list.length ? F.list[0].v : 1;
    for (const d of shown) {
      const o = originById[d.id];
      const li = el("li");
      const b = el("button", "orow");
      b.type = "button";
      b.setAttribute("aria-pressed", String(S.origin === d.id));
      const vl = el("span", "vl", d.v ? fmtCount(d.v, approx) : "–");
      if (d.v && F.total) vl.append(el("small", null, pct(d.v / F.total)));
      const bar = el("span", "bar");
      const i = el("i");
      i.style.width = (100 * d.v) / max + "%";
      i.style.background = color[o.group];
      bar.append(i);
      b.append(el("span", "nm", o.name), vl, bar);
      b.addEventListener("click", () => selectOrigin(S.origin === d.id ? null : d.id));
      li.append(b);
      list.append(li);
    }
    const more = $("more");
    more.hidden = F.list.length <= 10 && !S.showAll;
    more.textContent = S.showAll ? "Top 10" : `All ${F.list.length} origins`;
    $("o-search").hidden = !S.showAll;
    drawDetail();
  }
  function drawDetail() {
    const box = $("detail");
    if (!S.origin) { box.hidden = true; return; }
    const o = originById[S.origin];
    box.hidden = false;
    box.replaceChildren();
    const head = el("div", "d-head");
    const h = el("h3");
    const k = el("i");
    k.style.background = color[o.group];
    h.append(k, document.createTextNode(o.name));
    const clr = el("button", "link", "Clear");
    clr.type = "button";
    clr.addEventListener("click", () => selectOrigin(null));
    head.append(h, clr);
    box.append(head);
    const arr = flowBy[o.id] || new Float64Array(NY);
    let peak = 0, peakY = null, total = 0;
    arr.forEach((v, i) => { total += v; if (v > peak) { peak = v; peakY = Y0 + i; } });
    const nat = interp(D.stock.nat.o[o.id], S.year);
    let txt = peakY ? `Most arrivals in one year: ${fmtInt(Math.round(peak))} in ${peakY}. ${fmtInt(Math.round(total))} in all since ${Y0}.` : "No arrivals recorded.";
    if (nat) txt += ` ${nat.exact ? "" : "About "}${fmtInt(Math.round(nat.v))} people born here lived in the US in ${S.year}.`;
    if (o.note) txt += " " + o.note;
    box.append(el("p", null, txt));
    const Wd = Math.max(260, box.clientWidth - 28), Ht = 64;
    const x = d3.scaleLinear().domain([Y0, Y1]).range([0, Wd]);
    const yS = d3.scaleLinear().domain([0, peak || 1]).range([Ht - 2, 4]);
    const s = d3.create("svg").attr("viewBox", `0 0 ${Wd} ${Ht}`).attr("aria-label", `Arrivals from ${o.name} by year`);
    const pts = Array.from(arr, (v, i) => [Y0 + i, v]);
    s.append("path").attr("d", d3.area().x((d) => x(d[0])).y0(Ht - 2).y1((d) => yS(d[1]))(pts)).attr("fill", color[o.group]).attr("fill-opacity", 0.18);
    s.append("path").attr("d", d3.line().x((d) => x(d[0])).y((d) => yS(d[1]))(pts)).attr("fill", "none").attr("stroke", color[o.group]).attr("stroke-width", 1.5);
    s.append("line").attr("x1", x(S.year)).attr("x2", x(S.year)).attr("y1", 0).attr("y2", Ht).attr("stroke", css("--ink")).attr("stroke-width", 1);
    box.append(s.node());
  }
  function selectOrigin(id) {
    S.origin = id;
    drawMap();
    drawList();
  }

  // ---------- headline ----------
  function currentEvent(y, within) {
    let best = null;
    for (const e of D.events) if (e.y <= y && y - e.y <= within && (!best || e.y >= best.y)) best = e;
    return best;
  }
  function drawHeadline() {
    const y = S.year;
    $("year").textContent = y;
    const F = flowsAt(y);
    const bi = basisInfo(F.basis);
    const est = bi.cls === "estimate";
    const lede = $("lede");
    lede.replaceChildren();
    const txt = (t) => lede.append(document.createTextNode(t));
    const strong = (t) => lede.append(el("strong", null, t));
    if (F.total) {
      const n = est ? roundEst(F.total) : F.total;
      txt(est ? "About " : "");
      strong(fmtInt(n));
      txt(` ${n === 1 ? "person" : "people"} arrived in ${y}. `);
      const named = F.list.filter((d) => !originById[d.id].residual).slice(0, 2);
      if (named.length) {
        txt(named[1] ? "The largest groups came from " : "The largest group came from ");
        strong(originById[named[0].id].name);
        txt(` (${pct(named[0].v / F.total)})`);
        if (named[1]) { txt(" and "); strong(originById[named[1].id].name); txt(` (${pct(named[1].v / F.total)})`); }
        txt(". ");
      }
      const forced = F.list.filter((d) => originById[d.id].forced).reduce((s, d) => s + d.v, 0);
      if (forced > 0) txt(`About ${fmtInt(roundEst(forced))} were enslaved Africans brought by force. `);
    } else {
      txt(y === Y1 ? `Arrivals for ${y} haven't been published yet. ` : `No arrivals are recorded for ${y}. `);
    }
    const nt = interp(D.stock.nat.total, y), np = interp(D.stock.nat.pop, y);
    if (nt && np) { txt(nt.exact ? "" : "About "); strong(pct(nt.v / np.v)); txt(" of US residents were born abroad."); }
    const b = $("basis");
    b.className = "basis " + bi.cls;
    b.replaceChildren(el("i"), document.createTextNode(bi.label));
    b.title = bi.long || "";
    const ev = currentEvent(y, 12);
    const ctx = $("context");
    ctx.replaceChildren();
    if (ev) ctx.append(el("b", null, `${ev.y} · ${ev.title}. `), document.createTextNode(ev.t));
  }

  // ---------- about ----------
  function drawAbout() {
    const box = $("about-body");
    for (const p of D.about.intro) box.append(el("p", null, p));
    const ts = el("div", "table-scroll");
    const table = el("table");
    const hr = el("tr");
    for (const h of ["Years", "Arrivals by origin", "Immigrants living here"]) hr.append(el("th", null, h));
    const thead = el("thead");
    thead.append(hr);
    const tb = el("tbody");
    for (const e of D.eras) {
      const tr = el("tr");
      tr.append(el("td", null, e.years), el("td", null, e.flow), el("td", null, e.stock));
      tb.append(tr);
    }
    table.append(thead, tb);
    ts.append(table);
    box.append(ts);
    box.append(el("h3", null, "Caveats"));
    const ul = el("ul");
    for (const c of D.about.caveats) ul.append(el("li", null, c));
    box.append(ul);
    const det = el("details");
    det.append(el("summary", null, `Sources (${D.sources.length})`));
    const ul2 = el("ul");
    for (const s of D.sources) {
      const li = el("li", null, s.cite + " ");
      if (s.url) {
        const a = el("a", null, s.url.replace(/^https?:\/\//, "").replace(/\/$/, ""));
        a.href = s.url;
        a.target = "_blank";
        a.rel = "noopener";
        li.append(a);
      }
      ul2.append(li);
    }
    det.append(ul2);
    box.append(det);
  }

  // ---------- controls ----------
  let drawn = false;
  function setYear(y) {
    y = clamp(y, Y0, Y1);
    if (y === S.year && drawn) return;
    S.year = y;
    $("slider").value = y;
    try { history.replaceState(null, "", "#" + y); } catch (e) { /* sandboxed frame */ }
    drawAll();
  }
  function drawAll() {
    drawHeadline();
    drawMap();
    moveCursor();
    drawList();
    drawn = true;
  }
  function stopPlay() {
    if (!S.playing) return;
    S.playing = false;
    clearInterval(S.timer);
    $("play").setAttribute("aria-pressed", "false");
    $("play").setAttribute("aria-label", "Play");
    $("play-icon").setAttribute("d", "M4.5 2.5v11l9-5.5z");
  }
  function startPlay() {
    if (S.year >= Y1) setYear(Y0);
    S.playing = true;
    $("play").setAttribute("aria-pressed", "true");
    $("play").setAttribute("aria-label", "Pause");
    $("play-icon").setAttribute("d", "M4 2.5h3v11H4zM9 2.5h3v11H9z");
    S.timer = setInterval(() => (S.year >= Y1 ? stopPlay() : setYear(S.year + 1)), 140);
  }
  $("play").addEventListener("click", () => (S.playing ? stopPlay() : startPlay()));
  $("slider").addEventListener("input", (e) => { stopPlay(); setYear(+e.target.value); });
  $("slider").addEventListener("focus", () => stripBox.classList.add("slider-focus"));
  $("slider").addEventListener("blur", () => stripBox.classList.remove("slider-focus"));
  $("q").addEventListener("input", (e) => { S.query = e.target.value; drawList(); });
  $("more").addEventListener("click", () => { S.showAll = !S.showAll; if (!S.showAll) S.query = ""; $("q").value = S.query; drawList(); });
  $("series").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    S.series = b.dataset.series;
    for (const x of $("series").querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
    drawStrip();
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select") && e.target.id !== "slider") return;
    if (e.target.id === "slider") return; // the range input handles its own arrows
    if (e.key === "ArrowRight") { stopPlay(); setYear(S.year + (e.shiftKey ? 10 : 1)); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { stopPlay(); setYear(S.year - (e.shiftKey ? 10 : 1)); e.preventDefault(); }
    else if (e.key === " " && !e.target.closest("button, summary, a")) { S.playing ? stopPlay() : startPlay(); e.preventDefault(); }
    else if (e.key === "Escape" && S.origin) selectOrigin(null);
  });

  const onTheme = () => { readColors(); drawStrip(); drawAll(); };
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onTheme); } catch (e) { /* old browsers */ }
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  let rT = null, lastW = document.documentElement.clientWidth;
  window.addEventListener("resize", () => {
    clearTimeout(rT);
    rT = setTimeout(() => {
      if (Math.abs(document.documentElement.clientWidth - lastW) < 4) return;
      lastW = document.documentElement.clientWidth;
      layoutMap(); layoutStrip(); drawAll();
    }, 150);
  });

  // ---------- boot ----------
  $("y-start").textContent = Y0;
  $("y-end").textContent = Y1;
  const sl = $("slider");
  sl.min = Y0; sl.max = Y1; sl.value = S.year;
  layoutMap();
  layoutStrip();
  drawAbout();
  drawAll();
})();

</script>

</body>
</html>
